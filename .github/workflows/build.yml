name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # Le service de licences (server/) a sa propre CI.
    paths-ignore: ['server/**']
  pull_request:
    paths-ignore: ['server/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (interface + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Dépendances système de Tauri sous Linux (nécessaires pour compiler les tests Rust).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Vérification des types
        run: npx vue-tsc --noEmit
      - name: Tests interface (vitest)
        run: npm test
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test
      # Sécurité : outils de développement (inspecteur) absents de la version compilée.
      # Tauri ne les inclut qu'en mode dev, sauf si la fonction « devtools » est activée.
      - name: Pas de devtools en version compilée
        working-directory: src-tauri
        run: |
          if cargo tree -e features -i tauri | grep -F 'feature "devtools"'; then
            echo "::error::La fonction devtools de Tauri est activée : l'inspecteur serait disponible dans l'appli livrée."
            exit 1
          fi

  # Installeurs Windows seulement : la version Mac est construite en local (voir README).
  build:
    name: App Windows
    needs: test
    runs-on: windows-latest
    env:
      BUNDLE_DIR: src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      # Clé de signature des mises à jour (secrets du dépôt) : sans elle, l'appli installée
      # ne peut pas vérifier les mises à jour. On échoue clairement plutôt qu'au milieu du build.
      - name: Vérifier la clé de signature des mises à jour
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent (Settings → Secrets and variables → Actions)"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD vide (normal seulement si la clé n'a pas de mot de passe)"
          fi
          echo "Clé de signature des mises à jour : présente"

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Fichiers de mise à jour signés : seulement ici (le build Mac local n'en a pas besoin).
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json

      - name: Taille des installeurs
        shell: bash
        run: |
          {
            echo "### Installeurs Windows"
            echo '| Fichier | Taille |'
            echo '|---|---|'
            find "$BUNDLE_DIR" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' \) | while read -r f; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: devis-windows
          if-no-files-found: error
          # Installeurs + fichier de mise à jour signé (installeur NSIS et sa signature).
          path: |
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
            ${{ env.BUNDLE_DIR }}/nsis/*.exe.sig
            ${{ env.BUNDLE_DIR }}/msi/*.msi

  release:
    # Une pré-version par commit poussé sur main (tag build-N), jamais proposée en mise à jour ;
    # une release « officielle » par tag v*, avec latest.json lu par l'appli pour se mettre à jour.
    #
    # Les versions officielles sont déposées sur le service de licences (SERVICE_URL), où l'appli
    # (0.2 et suivantes) cherche ses mises à jour avec son ticket de licence. Transition : elles sont
    # aussi publiées dans le dépôt public RELEASES_REPO, où les postes plus anciens les trouvent.
    # Les pré-versions restent dans le dépôt du code.
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASES_REPO: kappuccino/devis-release
      SERVICE_URL: https://licence.cahors.kappuccino.net
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Installeurs à publier
        shell: bash
        run: |
          # Les fichiers arrivent dans des sous-dossiers (nsis/, msi/) : on les met à plat,
          # sans espaces dans les noms (GitHub les remplacerait, et latest.json doit donner l'URL exacte).
          mkdir -p out
          find dist -type f | while read -r f; do cp "$f" "out/$(basename "$f" | tr ' ' '-')"; done
          ls -la out
          ls out | grep -qE '\.(exe|msi)$'
      - name: Nom et notes de la release
        id: meta
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Version officielle : notes = message du tag (git tag -a v0.2.0 -m "…"),
            # affichées aussi dans la fenêtre de mise à jour de l'appli.
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
            notes=""
            if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
              notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message)
            fi
            [ -n "$notes" ] || notes="Version ${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "official=true" >> "$GITHUB_OUTPUT"
            { echo "body<<__EOF__"; echo "$notes"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          else
            # Pré-version : message du commit, sans les lignes techniques (Co-Authored-By…).
            notes=$(echo "$MESSAGE" | grep -v '^Co-Authored-By:')
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Build $GITHUB_RUN_NUMBER — $(echo "$notes" | head -1)" >> "$GITHUB_OUTPUT"
            echo "official=false" >> "$GITHUB_OUTPUT"
            { echo "body<<__EOF__"; echo "$notes"; echo; echo "Commit : $GITHUB_SHA"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          fi
      - name: latest.json (mises à jour)
        if: steps.meta.outputs.official == 'true'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ env.RELEASES_REPO }}
          SERVICE: ${{ env.SERVICE_URL }}
          NOTES: ${{ steps.meta.outputs.body }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, sys
          version = json.load(open("src-tauri/tauri.conf.json"))["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"::error::Le tag {tag} ne correspond pas à la version {version} de tauri.conf.json")
          def manifest(base, target):
              files = [f for f in glob.glob("out/*-setup.exe")]
              if len(files) != 1:
                  sys.exit(f"::error::Installeur introuvable ou ambigu : {files}")
              f = files[0]
              json.dump({
                  "version": version,
                  "notes": os.environ.get("NOTES", "").strip(),
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  # Windows seulement : la version Mac est construite en local, sans mise à jour automatique.
                  "platforms": {"windows-x86_64": {
                      "signature": open(f + ".sig").read().strip(),
                      "url": base + os.path.basename(f),
                  }},
              }, open(target, "w"), indent=2)
              print(open(target).read())
          # Releases GitHub (postes antérieurs à la 0.2), et service de licences (hors de out/).
          manifest(f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/", "out/latest.json")
          manifest(f"{os.environ['SERVICE']}/updates/{version}/", "service-latest.json")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          target_commitish: ${{ github.sha }}
          # Seules les releases officielles sont « latest » : c'est là que l'appli cherche latest.json.
          prerelease: ${{ steps.meta.outputs.official != 'true' }}
          make_latest: ${{ steps.meta.outputs.official == 'true' }}
          fail_on_unmatched_files: true
          files: out/*

      # Jeton à accès limité au dépôt public des releases (Contents : lecture et écriture).
      - name: Vérifier le jeton du dépôt des releases
        if: steps.meta.outputs.official == 'true'
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : la version ne serait pas publiée dans $RELEASES_REPO (Settings → Secrets and variables → Actions)"; exit 1
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.meta.outputs.official == 'true'
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          # Le dépôt des releases n'a pas ce commit : le tag y est posé sur sa branche principale.
          target_commitish: main
          make_latest: true
          fail_on_unmatched_files: true
          files: out/*

      # Dépôt sur le service de licences : installeurs d'abord, latest.json en dernier (un poste ne
      # voit jamais une version incomplète). Jeton : secret RELEASE_UPLOAD_TOKEN.
      - name: Déposer la version sur le service de licences
        if: steps.meta.outputs.official == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASE_UPLOAD_TOKEN absent (Settings → Secrets and variables → Actions)"; exit 1
          fi
          version="${TAG#v}"
          for f in out/*; do
            [ "$(basename "$f")" = latest.json ] && continue
            echo "→ $(basename "$f")"
            curl -fsS --retry 3 -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$SERVICE_URL/api/releases/$version/$(basename "$f")"
            echo
          done
          curl -fsS --retry 3 -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary @service-latest.json "$SERVICE_URL/api/releases/latest.json"
