name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (interface + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Dépendances système de Tauri sous Linux (nécessaires pour compiler les tests Rust).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Vérification des types
        run: npx vue-tsc --noEmit
      - name: Tests interface (vitest)
        run: npm test
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test

  # Installeurs Windows seulement : la version Mac est construite en local (voir README).
  build:
    name: App Windows
    needs: test
    runs-on: windows-latest
    env:
      BUNDLE_DIR: src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      # Clé de signature des mises à jour (secrets du dépôt) : sans elle, l'appli installée
      # ne peut pas vérifier les mises à jour. On échoue clairement plutôt qu'au milieu du build.
      - name: Vérifier la clé de signature des mises à jour
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent (Settings → Secrets and variables → Actions)"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD vide (normal seulement si la clé n'a pas de mot de passe)"
          fi
          echo "Clé de signature des mises à jour : présente"

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Fichiers de mise à jour signés : seulement ici (le build Mac local n'en a pas besoin).
        run: npm run tauri -- build --config src-tauri/tauri.updater.conf.json

      - name: Taille des installeurs
        shell: bash
        run: |
          {
            echo "### Installeurs Windows"
            echo '| Fichier | Taille |'
            echo '|---|---|'
            find "$BUNDLE_DIR" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' \) | while read -r f; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: devis-windows
          if-no-files-found: error
          # Installeurs + fichier de mise à jour signé (installeur NSIS et sa signature).
          path: |
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
            ${{ env.BUNDLE_DIR }}/nsis/*.exe.sig
            ${{ env.BUNDLE_DIR }}/msi/*.msi

  release:
    # Une pré-version par commit poussé sur main (tag build-N), jamais proposée en mise à jour ;
    # une release « officielle » par tag v*, avec latest.json lu par l'appli pour se mettre à jour.
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Installeurs à publier
        shell: bash
        run: |
          # Les fichiers arrivent dans des sous-dossiers (nsis/, msi/) : on les met à plat,
          # sans espaces dans les noms (GitHub les remplacerait, et latest.json doit donner l'URL exacte).
          mkdir -p out
          find dist -type f | while read -r f; do cp "$f" "out/$(basename "$f" | tr ' ' '-')"; done
          ls -la out
          ls out | grep -qE '\.(exe|msi)$'
      - name: Nom de la release
        id: meta
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Build $GITHUB_RUN_NUMBER — $(echo "$MESSAGE" | head -1)" >> "$GITHUB_OUTPUT"
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi
          { echo "body<<__EOF__"; echo "$MESSAGE"; echo; echo "Commit : $GITHUB_SHA"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
      - name: latest.json (mises à jour)
        if: steps.meta.outputs.official == 'true'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, sys
          version = json.load(open("src-tauri/tauri.conf.json"))["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"::error::Le tag {tag} ne correspond pas à la version {version} de tauri.conf.json")
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/"
          def entry(pattern):
              files = [f for f in glob.glob(f"out/{pattern}") if not f.endswith(".sig")]
              if len(files) != 1:
                  sys.exit(f"::error::Fichier de mise à jour introuvable ou ambigu : {pattern} → {files}")
              f = files[0]
              return {"signature": open(f + ".sig").read().strip(), "url": base + os.path.basename(f)}
          json.dump({
              "version": version,
              "notes": os.environ.get("MESSAGE", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              # Windows seulement : la version Mac est construite en local, sans mise à jour automatique.
              "platforms": {"windows-x86_64": entry("*-setup.exe")},
          }, open("out/latest.json", "w"), indent=2)
          print(open("out/latest.json").read())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          target_commitish: ${{ github.sha }}
          # Seules les releases officielles sont « latest » : c'est là que l'appli cherche latest.json.
          prerelease: ${{ steps.meta.outputs.official != 'true' }}
          make_latest: ${{ steps.meta.outputs.official == 'true' }}
          fail_on_unmatched_files: true
          files: out/*
